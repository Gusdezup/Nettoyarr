name: Publish Docker image

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE_NAME: ghcr.io/gusdezup/nettoyarr

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extraire le numéro de version depuis le tag (v0.1.1 -> 0.1.1)
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Extraire la section du CHANGELOG pour ce tag
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ && flag {exit}
            flag {print}
          ' CHANGELOG.md > release_notes.md
          echo "--- Notes extraites pour $VERSION ---"
          cat release_notes.md

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
